name: CI

on:
  push:
    branches: [master, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install LÖVE, Xvfb, Mesa, LuaJIT
        run: sh tools/love_install.sh
      - name: make test-all
        run: make test-all
      - name: make sanitize-net
        run: make sanitize-net
      - name: make full-game
        run: make full-game

  love-capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install LÖVE, Xvfb, Mesa, LuaJIT
        run: sh tools/love_install.sh
      - name: make love-capture
        run: make love-capture
      - name: make love-check
        run: make love-check

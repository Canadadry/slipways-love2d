# Which buttons trigger each action of the game, mode by mode.
#
# One line per binding: mode.action = N[, N...]
# # starts a comment. Blank lines are ignored.
#
# Buttons are numbered 1 to 12; the pad table of docs/love-port/design.md
# maps them to LÖVE gamepad buttons.
#
# A missing line leaves the action unbound in that mode: nothing falls back
# to this file. Binding the same button to two actions of one mode is an
# error; the same button in different modes is normal.
#
# The game reads a personal bindings.cfg in this format at start; an
# invalid one stops the game with file:line. Nothing reads this file: its
# defaults are game/game/bindings_default.lua, kept in step by hand.
# Replay refuses a recording marked "bindings": "personal".
#
# Reserved: buttons 5 and 6 pressed together are the developer cheat chord,
# fixed below the bindings. From the frame both are down until both are up,
# neither button reaches any action of any mode, whatever this file says.
#
# Across modes: point at a thing, and the mode's act action acts on it; its
# back action backs out. Each back press backs out one step: first a pause
# or a box (the year box included), then a slipway or a structure being
# placed, then aim mode, then the jump back to the last object acted on.
# pause opens from jump, aim, slipway, build_bar and placement, not from a
# menu, the panels or the title: those modes have no pause line.
# select_tap_or_year is read in jump and aim together: a button bound to it
# in either mode works in both.

# title: the difficulty rows, before a game starts.
# A choose_row held from before the rows appeared picks nothing until it is
# pressed again.
title.move_up = 1
title.move_down = 2
title.move_left = 3
title.move_right = 4
title.choose_row = 5

# jump: on the map, the cursor jumps from object to object, shown as a
# blinking ring on it; the game starts here once an object is known.
# A jump_* action jumps to the next object that way, anywhere on the map;
# nothing moves when none lies that way. Holding it repeats the jump. The
# camera follows only near the screen edge.
# act_on_hovered on a colony or structure starts a slipway; on a known
# planet it opens its projects. open_menu opens the hovered object's box
# (the menu mode). enter_aim enters aim mode. back first closes a shown
# message box (such as the year box) and does nothing else; otherwise it
# jumps back to the last object acted on: the one act_on_hovered pressed,
# or the far end of the last slipway built.
# select_tap_or_year: a tap jumps to the next colony or structure whose
# panel lists a need. Held about half a second, it ends the year, once per
# hold; a fresh press within a quarter of a second after a year ends ends
# one more.
jump.jump_up = 1
jump.jump_down = 2
jump.jump_left = 3
jump.jump_right = 4
jump.act_on_hovered = 5
jump.back = 6
jump.enter_aim = 7
jump.open_menu = 8
jump.open_build_bar = 9
jump.open_tech_panel = 10
jump.pause = 11
jump.select_tap_or_year = 12

# aim: on the map, a free crosshair at the centre pans over it; a game with
# nothing known starts here. Holding a pan_* action accelerates the pan.
# probe_or_fold on empty space launches the probe; once a probe is out,
# held, it folds space. back and leave_aim have the same effect: back to
# jump on the object nearest the crosshair; until an object is known, both
# do nothing. back first closes a shown message box and does nothing else.
# There is no open_menu in aim. select_tap_or_year as in jump.
aim.pan_up = 1
aim.pan_down = 2
aim.pan_left = 3
aim.pan_right = 4
aim.probe_or_fold = 5
aim.back = 6
aim.leave_aim = 7
aim.open_build_bar = 9
aim.open_tech_panel = 10
aim.pause = 11
aim.select_tap_or_year = 12

# slipway: on the map, a slipway is being drawn from a planet, started by
# jump.act_on_hovered on a colony or structure. The jump_* actions aim it
# at another object; the cost or the refusal ("too far", or a forbidden
# sign when already linked, when the path crosses a slipway or passes a
# planet) shows above it. Holding a jump_* action repeats the
# jump. build_on_target builds it; a refused one aims again from the same
# start. Once built, the next slipway starts from the object reached, so
# build_on_target and the jump_* actions chain them; a full slipgate
# starts nothing. cancel_slipway drops the slipway; it first closes a
# shown message box and does nothing else. open_build_bar and
# open_tech_panel first cancel the slipway.
slipway.jump_up = 1
slipway.jump_down = 2
slipway.jump_left = 3
slipway.jump_right = 4
slipway.build_on_target = 5
slipway.cancel_slipway = 6
slipway.open_build_bar = 9
slipway.open_tech_panel = 10
slipway.pause = 11

# menu: any box over the map (the box of a hovered object), or a panel over
# the build bar. open_menu pressed again closes the box. open_build_bar and
# open_tech_panel first close the box. A choose_row held from before the box
# opened picks nothing until it is pressed again.
menu.move_up = 1
menu.move_down = 2
menu.move_left = 3
menu.move_right = 4
menu.choose_row = 5
menu.close_menu = 6
menu.open_menu = 8
menu.open_build_bar = 9
menu.open_tech_panel = 10

# pause: while the pause box is shown.
# A choose_row held from before pause opened picks nothing until it is
# pressed again.
pause.move_up = 1
pause.move_down = 2
pause.move_left = 3
pause.move_right = 4
pause.choose_row = 5
pause.close_pause = 6, 11

# build_bar: the build bar is open.
# pick_left and pick_right pick a structure; take_structure takes it into
# placement. A pick happens only on a frame where neither panels.move_up
# nor panels.move_down is pressed: the bar borrows the panels' up and down.
# open_build_bar pressed again, or close_bar, closes the bar;
# open_tech_panel closes it and opens the tech panel.
build_bar.pick_left = 3
build_bar.pick_right = 4
build_bar.take_structure = 5
build_bar.close_bar = 6
build_bar.open_build_bar = 9
build_bar.open_tech_panel = 10
build_bar.pause = 11

# placement: carrying a structure taken from the build bar.
# The pan_* actions move the camera under the structure; holding one
# accelerates the pan. place_structure places it; cancel_placement cancels
# it, but first closes a shown message box and does nothing else.
# open_build_bar and open_tech_panel first cancel the placement. pause
# keeps the structure and gives it back when pause closes.
placement.pan_up = 1
placement.pan_down = 2
placement.pan_left = 3
placement.pan_right = 4
placement.place_structure = 5
placement.cancel_placement = 6
placement.open_build_bar = 9
placement.open_tech_panel = 10
placement.pause = 11

# panels: the tech and score panels. next_panel goes tech, then score,
# then closed; close_panel goes back to the map; open_build_bar opens the
# build bar.
# A choose_row held from before the panel opened picks nothing until it is
# pressed again.
panels.move_up = 1
panels.move_down = 2
panels.move_left = 3
panels.move_right = 4
panels.choose_row = 5
panels.close_panel = 6
panels.open_build_bar = 9
panels.next_panel = 10
